<svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <!-- Fondo circular oscuro -->
  <defs>
    <radialGradient id="bgGrad" cx="50%" cy="45%" r="50%">
      <stop offset="0%" stop-color="#1a3528"/>
      <stop offset="100%" stop-color="#0a1410"/>
    </radialGradient>
    <clipPath id="circle-clip">
      <circle cx="100" cy="100" r="97"/>
    </clipPath>
  </defs>

  <circle cx="100" cy="100" r="99" fill="#0a1410"/>
  <circle cx="100" cy="100" r="97" fill="url(#bgGrad)"/>
  <circle cx="100" cy="100" r="97" fill="none" stroke="#2a5a40" stroke-width="2"/>

  <!-- Torre petrolera (derrick) -->
  <g clip-path="url(#circle-clip)" fill="white" opacity="0.92">
    <!-- Plataforma base -->
    <rect x="72" y="128" width="56" height="4" rx="1"/>
    <!-- Patas de la torre -->
    <polygon points="100,42 82,128 88,128 100,55 112,128 118,128"/>
    <!-- Travesaños horizontales -->
    <rect x="85" y="112" width="30" height="2"/>
    <rect x="87" y="97"  width="26" height="2"/>
    <rect x="89" y="83"  width="22" height="2"/>
    <rect x="91" y="70"  width="18" height="2"/>
    <rect x="93" y="58"  width="14" height="2"/>
    <!-- Cabeza de la torre -->
    <rect x="96" y="36" width="8" height="8"/>
    <polygon points="94,36 106,36 100,28"/>
    <!-- Linea vertical central superior -->
    <rect x="99" y="42" width="2" height="14"/>
  </g>

  <!-- Texto GRS -->
  <text x="100" y="162"
        font-family="Georgia, 'Times New Roman', serif"
        font-style="italic"
        font-size="30"
        font-weight="bold"
        fill="white"
        text-anchor="middle"
        letter-spacing="2">GRS</text>

  <!-- Subtítulo -->
  <text x="100" y="178"
        font-family="Arial, Helvetica, sans-serif"
        font-size="7.2"
        fill="#c8e6d0"
        text-anchor="middle"
        letter-spacing="0.3">General Rigs Services S.A.S.</text>
</svg>
