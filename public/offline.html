<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sin conexión — Pump Tracker</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #f1f5f9;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    padding: 2rem;
  }
  .card {
    background: white;
    border-radius: 1rem;
    padding: 2.5rem;
    text-align: center;
    max-width: 400px;
    width: 100%;
    box-shadow: 0 4px 24px rgba(0,0,0,0.08);
  }
  .icon { font-size: 3.5rem; margin-bottom: 1rem; }
  h1 { font-size: 1.25rem; color: #1e3a5f; margin-bottom: 0.5rem; }
  p { color: #64748b; font-size: 0.9rem; line-height: 1.6; margin-bottom: 1.5rem; }
  .tip {
    background: #eff6ff;
    border: 1px solid #bfdbfe;
    border-radius: 0.5rem;
    padding: 0.75rem 1rem;
    font-size: 0.8rem;
    color: #1e40af;
    margin-bottom: 1.5rem;
    text-align: left;
  }
  .tip strong { display: block; margin-bottom: 0.25rem; }
  button {
    background: #1e40af;
    color: white;
    border: none;
    border-radius: 0.5rem;
    padding: 0.75rem 2rem;
    font-size: 0.9rem;
    font-weight: 600;
    cursor: pointer;
    width: 100%;
  }
  button:hover { background: #1e3a8a; }
</style>
</head>
<body>
<div class="card">
  <div class="icon">📡</div>
  <h1>Sin conexión a internet</h1>
  <p>No se puede acceder a esta página porque no hay señal. Las páginas que ya visitaste siguen disponibles.</p>
  <div class="tip">
    <strong>💡 Mientras no hay señal puedes:</strong>
    Ver el dashboard, bombas y alertas que ya cargaste.<br>
    Los registros diarios guardados sin conexión se sincronizarán automáticamente.
  </div>
  <button onclick="window.location.reload()">🔄 Reintentar</button>
</div>
</body>
</html>
