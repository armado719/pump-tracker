; Copiar a: /etc/supervisor/conf.d/pump-tracker.conf
; Luego: supervisorctl reread && supervisorctl update

[program:pump-tracker-worker]
process_name=%(program_name)s_%(process_num)02d
command=php /var/www/pump-tracker/artisan queue:work database --sleep=3 --tries=3 --max-time=3600
directory=/var/www/pump-tracker
autostart=true
autorestart=true
stopasgroup=true
killasgroup=true
user=www-data
numprocs=2
redirect_stderr=true
stdout_logfile=/var/log/pump-tracker-worker.log
stdout_logfile_maxbytes=10MB
stdout_logfile_backups=3
stopwaitsecs=3600
